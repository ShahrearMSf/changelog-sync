# Publishes the released version's changelog entry to the website — ONLY after the
# deploy workflow (e.g. WordPress.org) has finished successfully for that release.
# If the deploy fails or is cancelled, this workflow does not run (GitHub shows it as skipped).
#
# Use this file INSTEAD of publish-changelog.yml when the repo has a deploy workflow.
# Install only one of the two.
#
# ⚠ `workflows:` below must equal the `name:` of your deploy workflow exactly
#   (GitHub does not allow a variable there). Renaming the deploy workflow silently
#   stops this one — scripts/preflight.sh checks the match.
# ⚠ GitHub runs the copy of this file on the DEFAULT branch, so merge it there.
#
# Repo settings → Secrets and variables → Actions
#   Secrets:   CHANGELOG_ENDPOINT   https://<site>/wp-json/changelog-sync/v1/entry
#              CHANGELOG_SECRET     same value as CHANGELOG_SYNC_SECRET on the site
#   Variables: CHANGELOG_PRODUCT        slug, e.g. notificationx       (default: repo name)
#              CHANGELOG_PRODUCT_NAME   label, e.g. NotificationX      (default: slug)
#              CHANGELOG_README         path, e.g. readme.txt          (default: readme.txt)
#              CHANGELOG_STATUS         publish | draft                (default: publish)
#              CHANGELOG_DATE_ORDER     dmy | mdy for 01/02/2026 dates (default: dmy)
#              CHANGELOG_EXTRA_DATES    JSON dates for versions with no date in readme.txt AND
#                                       no GitHub Release, e.g. {"1.0.0":"2026-07-30"}
#
# Readme headers without a date ("= 1.3.0 =") get the date of their GitHub Release.
name: Publish changelog

on:
  workflow_run:
    workflows: ["Deploy to WordPress.org"]   # ← must match your deploy workflow's name
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to send (blank = top entry of readme.txt)"
        required: false
      status:
        description: "Post status on the site"
        type: choice
        options: [default, publish, draft]
        default: default
      all:
        description: "Backfill: send EVERY entry in readme.txt (safe to repeat)"
        type: boolean
        default: false

# One queue PER VERSION: GitHub keeps only one pending run per group and cancels older
# pending ones, so a per-repo group could silently drop a release that finished close to another.
concurrency:
  group: changelog-${{ github.repository }}-${{ github.event.workflow_run.head_branch || inputs.version || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # Runs only when the deploy was started by a release AND succeeded (or on a manual run).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'release' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The exact commit the deploy shipped (manual runs: the selected branch).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Find the release
        id: release
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          ENC=$(jq -rn --arg t "$TAG" '$t | @uri')
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ENC" > "$RUNNER_TEMP/release.json"
          jq '{release: .}' "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/event.json"
          echo "Release: $(jq -r '.tag_name + " published " + .published_at + " prerelease=" + (.prerelease|tostring)' "$RUNNER_TEMP/release.json")"
          if [ "$(jq -r '.prerelease' "$RUNNER_TEMP/release.json")" = "true" ]; then
            echo "::notice::$TAG is a pre-release — not published to the changelog"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "event=$RUNNER_TEMP/event.json" >> "$GITHUB_OUTPUT"

      - name: Collect release dates
        # Only used for readme versions whose header has no date.
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName,publishedAt,isPrerelease,isDraft \
            --jq '[.[] | select(.isDraft | not) | select(.isPrerelease | not) | {key: (.tagName | ltrimstr("v")), value: .publishedAt[0:10]}] | from_entries' \
            > "$RUNNER_TEMP/release-dates.json" || echo '{}' > "$RUNNER_TEMP/release-dates.json"
          echo "Release dates: $(cat "$RUNNER_TEMP/release-dates.json")"

      - name: Extract changelog entry
        if: steps.release.outputs.skip != 'true'
        env:
          CHANGELOG_EVENT_PATH: ${{ steps.release.outputs.event }}
          CHANGELOG_PRODUCT: ${{ vars.CHANGELOG_PRODUCT }}
          CHANGELOG_PRODUCT_NAME: ${{ vars.CHANGELOG_PRODUCT_NAME }}
          CHANGELOG_README: ${{ vars.CHANGELOG_README || 'readme.txt' }}
          CHANGELOG_DATE_ORDER: ${{ vars.CHANGELOG_DATE_ORDER || 'dmy' }}
          CHANGELOG_RELEASE_DATES_FILE: ${{ runner.temp }}/release-dates.json
          CHANGELOG_EXTRA_DATES: ${{ vars.CHANGELOG_EXTRA_DATES }}
          CHANGELOG_STATUS: ${{ (inputs.status && inputs.status != 'default') && inputs.status || vars.CHANGELOG_STATUS || 'publish' }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ALL: ${{ inputs.all }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${INPUT_ALL:-false}" = "true" ]; then ARGS+=(--all);
          elif [ -n "${INPUT_VERSION:-}" ]; then ARGS+=(--version "$INPUT_VERSION"); fi
          node .github/scripts/parse-changelog.js "${ARGS[@]}" > entry.json
          echo '### Changelog payload' >> "$GITHUB_STEP_SUMMARY"
          { echo '```json'; cat entry.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Send to website
        if: steps.release.outputs.skip != 'true'
        env:
          CHANGELOG_ENDPOINT: ${{ secrets.CHANGELOG_ENDPOINT }}
          CHANGELOG_SECRET: ${{ secrets.CHANGELOG_SECRET }}
        run: node .github/scripts/send-changelog.js entry.json
